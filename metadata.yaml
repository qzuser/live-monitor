name: live_monitor
display_name: 直播开播/稿件/动态监控
short_desc: 监控直播间开播/关播、B站UP主新稿件与新动态，自动通知订阅的群或个人。
desc: >-
  支持 B站直播、斗鱼、虎牙、抖音直播的开播/关播监控，
  以及B站UP主新稿件、新动态监控（按 mid 或空间链接添加UP主：稿件推送标题、BV号与封面，
  动态覆盖图文/纯文字/转发/专栏以及稿件列表里根本没有的「动态视频」）。
  可在聊天中通过 /直播监控 添加、删除、订阅监控对象，
  状态变化时自动向订阅的会话推送通知（开播带距离上次直播的时间、关播带本次直播时长），
  管理员还能用 /直播监控 通知 开播|稿件|动态|新版提醒… 开|关 直接在聊天里关掉某类推送，
  设置会持久化、重启后仍然生效；
  插件会定期检查 GitHub 上的新版本、有新版本时提醒已订阅的会话，
  管理员可用 /直播监控 更新 一键下载新版、校验、备份并自动热重载。
author: pulin
version: 0.4.0
repo: "https://github.com/qzuser/live-monitor"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - dingtalk
  - wecom
  - wecom_ai_bot
  - qq_official
  - lark
  - satori
  - weixin_official_account
astrbot_version: ">=4.17,<5"
